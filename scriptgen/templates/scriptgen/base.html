<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nick Scripts{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .teleprompter { font-size: 1.4rem; line-height: 2; letter-spacing: 0.01em; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <nav class="border-b border-gray-800 px-6 py-4 flex items-center gap-6">
        <a href="{% url 'dashboard' %}" class="text-xl font-bold text-white">Nick Scripts</a>
        <a href="{% url 'dashboard' %}" class="text-gray-400 hover:text-white {% if request.path == '/' %}text-white{% endif %}">Dashboard</a>
        <a href="{% url 'stories' %}" class="text-gray-400 hover:text-white {% if request.path == '/stories/' %}text-white{% endif %}">Stories</a>
        <a href="{% url 'trends' %}" class="text-gray-400 hover:text-white {% if request.path == '/trends/' %}text-white{% endif %}">Trends</a>
        <a href="/admin/" class="text-gray-400 hover:text-white ml-auto">Admin</a>
    </nav>
    <main class="max-w-6xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
